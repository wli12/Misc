name: Update hot list and deploy

on:
  push:
    paths: ['site/**', 'scripts/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch hot list
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.mjs
      - name: Stop scheduled runs when the fetch failed
        # A push still deploys with the committed snapshot; a scheduled run
        # fails here so the last good deployment stays live.
        if: steps.fetch.outcome == 'failure' && github.event_name != 'push'
        run: exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
