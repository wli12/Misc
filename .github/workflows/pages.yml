name: Update hot list and deploy

on:
  push:
    paths: ['site/**', 'scripts/**', '.github/workflows/pages.yml']
  schedule:
    # GitHub runs only a fraction of scheduled slots on a quiet repository, so ask often.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hot list
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.mjs
        env:
          # Optional: without it the English sources keep their English titles.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Refresh movie lists
        # Keeps the committed snapshot when the upstream list is unreachable.
        continue-on-error: true
        run: node scripts/build-movies.mjs
      - name: Stop scheduled runs when the fetch failed
        # A push still deploys with the committed snapshot; a scheduled run
        # fails here so the last good deployment stays live.
        if: steps.fetch.outcome == 'failure' && github.event_name != 'push'
        run: exit 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
