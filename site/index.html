<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>热榜速读</title>
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #fffdf8;
    --ink: #1f1d1a;
    --ink-2: #5d574e;
    --ink-3: #958d81;
    --line: #e4ded2;
    --accent: #c2410c;
    --accent-soft: #fbe9dd;
    --read: #a8a195;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #201e1b;
      --ink: #ece7dd;
      --ink-2: #b3ab9d;
      --ink-3: #7d766b;
      --line: #33302b;
      --accent: #f08a4b;
      --accent-soft: #3a2619;
      --read: #6f695f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ---------- list ---------- */
  .masthead { padding: 36px 0 18px; border-bottom: 2px solid var(--ink); }
  .masthead h1 { font-family: var(--serif); font-size: 34px; line-height: 1.15; margin: 0; letter-spacing: .04em; }
  .masthead p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; }
  .list { list-style: none; margin: 0; padding: 0 0 64px; }
  .item { border-bottom: 1px solid var(--line); }
  .item a {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 12px;
    padding: 18px 0; text-decoration: none; align-items: start;
  }
  .rank {
    font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1.25;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
  }
  .item:nth-child(-n+3) .rank { color: var(--accent); }
  .item h2 { font-family: var(--serif); font-size: 18px; line-height: 1.45; margin: 0; font-weight: 700; text-wrap: pretty; }
  .item .lede {
    margin: 6px 0 0; color: var(--ink-2); font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { margin-top: 8px; font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .tag { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 5px; font-weight: 600; }
  .thumb { width: 96px; height: 68px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .item.read h2, .item.read .rank { color: var(--read); }
  @media (hover: hover) { .item a:hover h2 { text-decoration: underline; text-underline-offset: 4px; } }
  @media (max-width: 480px) {
    .masthead h1 { font-size: 28px; }
    .item a { grid-template-columns: 26px 1fr auto; gap: 10px; }
    .rank { font-size: 20px; }
    .item h2 { font-size: 17px; }
    .thumb { width: 76px; height: 56px; }
  }

  .state { padding: 72px 0; text-align: center; color: var(--ink-2); }
  .state button { color: var(--accent); text-decoration: underline; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"><div class="wrap state">正在取热榜…</div></main>

<script>
(() => {
  const app = document.getElementById('app');
  const READ_KEY = 'hot-read-v1';
  // The snapshot sits next to this page on zhihu.hackerfun.org; the copy served from
  // hackerfun.org/zhihu has no data of its own and reads it from there.
  const DATA_URLS = ['data/hot.json', 'https://zhihu.hackerfun.org/data/hot.json'];
  let data = null;

  const el = (tag, props = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
    return node;
  };

  const readSet = () => {
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); }
  };
  const markRead = (id) => {
    try {
      const s = readSet(); s.add(id);
      localStorage.setItem(READ_KEY, JSON.stringify([...s].slice(-300)));
    } catch {}
  };

  const webUrl = (it) => `https://www.zhihu.com/question/${it.id}`;
  // Experiment, switched on with ?tab=1 or ?tab=2: open Zhihu in a new tab by way of
  // this page (#go=<id>), to find out whether such a tab survives Zhihu's attempt to
  // close itself. 1 opens the tab by script, 2 by a plain link.
  const TAB_MODE = new URLSearchParams(location.search).get('tab');

  const count = (n) => (n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万' : String(n));

  function ago(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins} 分钟前`;
    if (mins < 60 * 24) return `${Math.floor(mins / 60)} 小时前`;
    return `${Math.floor(mins / 1440)} 天前`;
  }

  function image(src, cls) {
    if (!src) return null;
    return el('img', {
      class: cls, src, alt: '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer',
      onerror: (e) => e.target.remove(),
    });
  }

  // Desktop: the link opens Zhihu in a new tab. Touch devices: go there in this tab,
  // by script. A tapped link would be handed to the installed app, and Zhihu's mobile
  // page closes any tab a web page opened for it once its "open the app" prompt is
  // declined, so a new tab cannot be kept. Back returns to this list.
  function openFromList(e, it) {
    markRead(it.id);
    e.currentTarget.parentNode.classList.add('read');
    if (TAB_MODE === '2') return; // the link itself opens the #go stop in a new tab
    if (TAB_MODE === '1') {
      e.preventDefault();
      const tab = window.open(`#go=${it.id}`, '_blank');
      if (tab) tab.opener = null;
      return;
    }
    if (!window.matchMedia('(pointer: coarse)').matches) return;
    e.preventDefault();
    setTimeout(() => { location.assign(webUrl(it)); }, 0);
  }

  function renderList() {
    const read = readSet();
    app.replaceChildren(
      el('div', { class: 'wrap' },
        el('header', { class: 'masthead' },
          el('h1', {}, '热榜速读'),
          el('p', {}, `知乎热榜 ${data.items.length} 条 · 更新于 ${ago(data.updatedAt)}`)),
        el('ol', { class: 'list' }, data.items.map((it) =>
          el('li', { class: 'item' + (read.has(it.id) ? ' read' : '') },
            el('a', { href: TAB_MODE ? `#go=${it.id}` : webUrl(it), target: '_blank', rel: 'noopener noreferrer', onclick: (e) => openFromList(e, it) },
              el('span', { class: 'rank' }, String(it.rank)),
              el('div', {},
                el('h2', {}, it.title),
                it.excerpt && el('p', { class: 'lede' }, it.excerpt),
                el('div', { class: 'meta' },
                  it.isNew && el('span', { class: 'tag' }, '新'),
                  el('span', {}, it.heat),
                  el('span', {}, `${count(it.answers)} 回答`))),
              image(it.image, 'thumb'))))))
    );
  }

  async function getJson(url, timeoutMs) {
    try {
      const res = await fetch(url, { cache: 'no-cache', signal: AbortSignal.timeout(timeoutMs) });
      const body = res.ok ? await res.json() : null;
      return Array.isArray(body?.items) && body.items.length ? body : null;
    } catch { return null; }
  }

  async function load() {
    try {
      data = null;
      for (const url of DATA_URLS) data ??= await getJson(url, 15000);
      if (!data) throw new Error('no data');
      renderList();
    } catch (err) {
      app.replaceChildren(el('div', { class: 'wrap state' },
        el('p', {}, '热榜没取到。'),
        el('button', { onclick: load }, '再试一次')));
    }
  }
  const go = location.hash.match(/^#go=(\d+)$/);
  if (!go) { load(); return; }
  const key = `hot-go-${go[1]}`;
  window.addEventListener('pageshow', () => {
    let seen = null;
    try { seen = sessionStorage.getItem(key); sessionStorage.setItem(key, '1'); } catch {}
    // First visit: move on to Zhihu. Coming back with the back button: show the list.
    if (!seen) { location.assign(webUrl({ id: go[1] })); return; }
    history.replaceState(null, '', location.pathname + location.search);
    if (!data) load();
  });
})();
</script>
</body>
</html>
